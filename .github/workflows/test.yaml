name: Tests
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "*"
  schedule:
    - cron: "0 13 * * 1"

jobs:
  conda:
    name: conda (${{ matrix.python-version }} | ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["macos-latest", "ubuntu-latest", "windows-latest"]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # setuptools_scm needs the tags
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-variant: Miniforge3
          environment-file: ci/environment-py${{ matrix.python-version }}.yml
          activate-environment: test-env-xroms
      - name: Install xroms
        shell: bash -l {0}
        run: python -m pip install -e . --no-deps --force-reinstall
      - name: Run tests
        shell: bash -l {0}
        run: pytest --cov=xroms --cov-report=xml
      - name: Upload code coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: false

  pip:
    # pip-installed variants: the bare minimum, the oldest supported xgcm, and
    # the dependency caps roms-tools runs with (so both can be installed together)
    name: pip (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            python-version: "3.11"
            extra: ""
          - name: xgcm-0.10
            python-version: "3.12"
            extra: '"xgcm==0.10.*"'
          - name: roms-tools-caps
            python-version: "3.12"
            extra: '"xarray==2025.7.*" "numpy==2.2.*" "xgcm==0.10.*"'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install xroms
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[test]" ${{ matrix.extra }}
          python -m pip check
      - name: Run tests
        run: pytest
