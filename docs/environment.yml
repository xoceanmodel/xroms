# Environment for building the docs. xroms itself is installed from the checkout
# (Read the Docs: python.install in .readthedocs.yaml; locally: pip install -e . --no-deps).
name: xroms-docs
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # xroms' dependencies
  - numpy
  - xarray
  - xgcm>=0.10
  - numba
  - dask
  # used by the example pages
  - cartopy
  - cf_xarray
  - cmocean
  - gsw
  - matplotlib-base
  - netcdf4
  - pandas
  - pooch
  - scipy  # xarray's interp
  - xesmf  # xroms.interpll
  # the docs build
  - furo
  - ipykernel
  - ipython
  - jupytext
  - myst-nb
  - numpydoc
  - sphinx
  - pip
  - pip:
      - sphinxcontrib-srclinks
