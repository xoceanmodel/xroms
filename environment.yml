# Development environment: mamba env create -f environment.yml
name: xroms
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.11
  # required
  - numpy
  - xarray
  - xgcm>=0.10
  - numba
  - dask
  # optional features
  - gsw          # density(..., eos="teos10")
  - pyproj       # argsel2d(method="geodesic")
  - pooch        # xroms.datasets example data
  - netcdf4
  - xesmf        # interpll / make_regridder (not available on Windows)
  - matplotlib-base
  - cmocean
  # development
  - pytest
  - pytest-cov
  - pre-commit
  - pip
