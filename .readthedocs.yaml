version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "miniforge3-latest"
  jobs:
    post_checkout:
      # setuptools_scm reads the version from git: fetch the full history and the tags
      - git fetch --unshallow || true
      - git fetch --tags || true

conda:
  environment: docs/environment.yml

# the docs describe this checkout's xroms, not the latest release
python:
  install:
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py

# a PDF as well as the HTML pages
formats:
  - pdf
